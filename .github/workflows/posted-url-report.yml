name: Posted URL report tests

on:
  pull_request:
    paths:
      - 'posted_urls_report.py'
      - 'tests/test_posted_urls_report.py'
      - '.github/workflows/posted-url-report.yml'
  push:
    paths:
      - 'posted_urls_report.py'
      - 'tests/test_posted_urls_report.py'
      - '.github/workflows/posted-url-report.yml'

jobs:
  report-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_posted_urls_report.py' -v
      - run: python -m py_compile posted_urls_report.py tests/test_posted_urls_report.py
